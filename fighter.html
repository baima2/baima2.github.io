<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雷霆战机</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      touch-action: none; /* 禁止触摸滚动/缩放 */
    }
  </style>
</head>
<body>
  <canvas id="myCanvas"></canvas>
  <script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"></script>
  <script type="application/processing" data-processing-target="myCanvas">
    // 游戏状态变量
    var start = false;
    var gameOver = false;
    var bullets = [];
    var damageHeight = 0;
    var enemies = [];
    var addEnemies = 0;
    var enemyWidth = innerWidth/20;
    var enemyHeight = enemyWidth;
    var planeSize = innerWidth/30;
    int enemyEscapedCount = 0;
    int enemyKilledCount = 0;
    int bulletsFired = 0;
    int bulletsAccessible = 0;
    var messages = [];
    var waiting = 0;

    // ===== 自定义触摸/鼠标变量（替代原生的 mouseX/mouseY/mousePressed）=====
    window.touchX = innerWidth / 2;   // 默认屏幕中心
    window.touchY = innerHeight / 2;
    window.touching = false;          // 是否按下（开火）

    // 添加敌机群
    void spawnEnemies(num) {
      addEnemies = (num == null || num === "") ? int(random(5, 20)) : int(num);
      for (int c = 0; c < addEnemies; c++) {
        float x;
        boolean tooClose = true;
        int attempts = 0;
        int maxAttempts = 100;

        while (tooClose && attempts < maxAttempts) {
          tooClose = false;
          attempts ++;
          x = random(0, innerWidth - enemyWidth);
          for (int i = 0; i < enemies.length; i++) {
            if (abs(x - enemies[i].x) <= enemyWidth) {
              tooClose = true;
              break;
            }
          }
        }

        enemies.push({
          x: x,
          y: 0,
          damageHeight: 0,
          speed: random(1, innerHeight / 30 / 5)
        });
      }
    }

    void setGame() {
      bullets = [];
      enemies = [];
      messages = [];
      waiting = 0;
      enemyEscapedCount = 0;
      enemyKilledCount = 0;
      bulletsFired = 0;
      bulletsAccessible = 1000;
      spawnEnemies();
    }
    
    void setup() {
      size(innerWidth, innerHeight);
      frameRate(30);

      // 获取canvas元素并添加事件监听（原生JS，确保触摸/鼠标都能更新自定义坐标）
      var canvas = document.getElementById('myCanvas');
      if (canvas) {
        // 触摸事件
        canvas.addEventListener('touchstart', function(e) {
          e.preventDefault();
          if (e.touches.length > 0) {
            window.touchX = e.touches[0].clientX;
            window.touchY = e.touches[0].clientY;
            window.touching = true;
          }
        }, { passive: false });

        canvas.addEventListener('touchmove', function(e) {
          e.preventDefault();
          if (e.touches.length > 0) {
            window.touchX = e.touches[0].clientX;
            window.touchY = e.touches[0].clientY;
            // 不修改 touching，保持按下状态
          }
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
          e.preventDefault();
          window.touching = false;
        }, { passive: false });

        canvas.addEventListener('touchcancel', function(e) {
          e.preventDefault();
          window.touching = false;
        }, { passive: false });

        // 鼠标事件（方便桌面调试）
        canvas.addEventListener('mousedown', function(e) {
          e.preventDefault();
          window.touchX = e.clientX;
          window.touchY = e.clientY;
          window.touching = true;
        });

        canvas.addEventListener('mousemove', function(e) {
          // 鼠标移动时始终更新坐标（即使不按下）
          window.touchX = e.clientX;
          window.touchY = e.clientY;
        });

        canvas.addEventListener('mouseup', function(e) {
          e.preventDefault();
          window.touching = false;
        });
      }
    }

    void draw() {
      background(100, 100, 155);

      // ===== 游戏未开始 =====
      if (start === false) {
        // 用 window.touchX/Y 和 window.touching 代替 mouseX/mouseY/mousePressed
        if (window.touchX > innerWidth/4 && window.touchX < innerWidth*3/4 &&
            window.touchY > innerHeight/4 && window.touchY < innerHeight*3/4) {
          if (window.touching) {
            fill(255, 255, 0);
            start = true;
            gameOver = false;
            setGame();
          } else {
            fill(0, 255, 0);  // 触摸在按钮内但没有按下 -> 变绿
          }
        } else {
          fill(255, 255, 255);
        }
        rect(innerWidth/4, innerHeight/4, innerWidth/2, innerHeight/2);
        fill(255, 0, 0);
        textAlign(CENTER, CENTER);
        textSize(innerWidth/20);
        text("开始游戏", innerWidth/2, innerHeight/2);
      }

      // ===== 游戏中 =====
      if (start === true) {
        // 游戏结束结算页面
        if (gameOver === true) {
          if (window.touchX > innerWidth/4 && window.touchX < innerWidth*3/4 &&
              window.touchY > innerHeight/4 && window.touchY < innerHeight*3/4 && waiting >= 5) {
            if (window.touching) {
              fill(255, 255, 0);
              gameOver = false;
              setGame();
            } else {
              fill(0, 255, 0);
            }
          } else {
            fill(255, 255, 255);
          }

          rect(innerWidth/4, innerHeight/4, innerWidth/2, innerHeight/2);
          fill(255, 0, 0);
          textAlign(CENTER, CENTER);
          textSize(innerWidth/20);
          waiting += 1/30;
          var afterFiveSeconds = ceil(5 - waiting);
          if (afterFiveSeconds >= 0 && gameOver === true) {
            text("子弹耗尽，游戏结束\n" + afterFiveSeconds + "秒后继续", innerWidth/2, innerHeight/2);
          } else {
            text("开始游戏 ", innerWidth/2, innerHeight/2);
          }
        }

        // 游戏进行中
        if (gameOver === false) {
          var bulletSize = planeSize / 6;
          var fireSize = planeSize / 3;
          //飞机坐标
          var planeX1 = window.touchX;
          var planeY1 = window.touchY - planeSize * 1.2;
          var planeX2 = window.touchX - planeSize;
          var planeY2 = window.touchY + planeSize;
          var planeX3 = window.touchX + planeSize;
          var planeY3 = window.touchY + planeSize;
          
          // 使用 window.touchX/Y 计算炮口位置
          var leftFireX = window.touchX - fireSize - bulletSize;
          var rightFireX = window.touchX + fireSize;
          var fireY = window.touchY - fireSize;
          var leftBulletX = leftFireX;
          var rightBulletX = rightFireX;
          var bulletY = fireY;

          // 绘制飞机
          fill(0, 255, 0);
          triangle(planeX1, planeY1,
                  planeX2, planeY2,
                  planeX3, planeY3);
          rect(leftFireX, fireY, bulletSize, fireSize * 3);
          rect(rightFireX, fireY, bulletSize, fireSize * 3);

          // 发射子弹（使用 window.touching）
          if (window.touching && bulletsAccessible > 0) {
            bullets.push({ x: leftBulletX, y: bulletY });
            bullets.push({ x: rightBulletX, y: bulletY });
            bulletsFired ++;
            bulletsAccessible --;
          }

          // 显示信息
          textSize(30);
          textAlign(LEFT, BOTTOM);
          fill(0, 255, 255);
          text("逃逸敌机：" + enemyEscapedCount, 100, 100);
          text("击毁敌机：" + enemyKilledCount, 100, 200);
          text("屏幕中敌机总数：" + enemies.length, 100, 300);
          text("共发射子弹：" + bulletsFired, 100, 400);
          text("可用子弹总数：" + bulletsAccessible, 100, 500);

          // 绘制敌机
          fill(255, 255, 0);
          for (var t = enemies.length - 1; t >= 0; t--) {
            rect(enemies[t].x, enemies[t].y, enemyWidth, enemyHeight);
            enemies[t].y += enemies[t].speed;
            if (enemies[t].y > innerHeight) {
              enemies.splice(t, 1);
              enemyEscapedCount ++;
            }
          }
          if (enemies.length < 10) {
            spawnEnemies();
          }
          if (bulletsAccessible === 0) {
            gameOver = true;
          }

          // 子弹逻辑
          for (var z = bullets.length - 1; z >= 0; z--) {
            fill(255, 255, 0);
            bullets[z].y -= 20;
            rect(bullets[z].x, bullets[z].y, bulletSize, bulletSize);
            if (bullets[z].y < 0) {
              bullets.splice(z, 1);
              continue;
            }

            for (var t = enemies.length - 1; t >= 0; t--) {
              if (enemies[t].x < bullets[z].x + bulletSize &&
                  enemies[t].x + enemyWidth > bullets[z].x &&
                  bullets[z].y < enemies[t].y + enemyHeight &&
                  bullets[z].y + bulletSize > enemies[t].y) {

                fill(255, 0, 0);
                // 两发命中，三倍伤害
                if (enemies[t].x < leftBulletX + bulletSize &&
                    enemies[t].x + enemyWidth > rightBulletX) {
                  enemies[t].damageHeight -= enemyWidth * 3 / 30;
                } else {
                  enemies[t].damageHeight -= enemyWidth / 30;
                }

                rect(enemies[t].x, enemies[t].y + enemyHeight, enemyWidth, enemies[t].damageHeight);
                if (enemies[t].damageHeight < -enemyHeight) {
                  enemyKilledCount ++;
                  bulletsAccessible += 10;
                  messages.push({
                    content: "子弹+10",
                    x: enemies[t].x + enemyWidth,
                    y: enemies[t].y,
                    life: 90
                  });
                  enemies[t].damageHeight = 0;
                  enemies.splice(t, 1);
                  spawnEnemies(floor(random(0, 3)));
                  continue;
                }
                bullets.splice(z, 1);
                break;
              }
            }
          }

          //检查是否撞击
          //palneX1，X2，X3是否在方块内
          //敌机的右下角坐标：enemies[t].x + enemyWidth , enemies[t].y + enemyHeight
          //设planeX2为原点，则所有坐标-planeX2，则ERX - planeX2, ERY - planeY2
          //飞机左侧直线为y = -2.2x + b; b = y1 + 2.2x1

          //敌机碰撞我机检测
          for (var t = enemies.length - 1; t >= 0; t--) {
          var enemyRightButtomCornerX = enemies[t].x + enemyWidth; 
          var enemyRightButtomCornerY = enemies[t].y + enemyHeight;
          var enemyRightButtomCornerYOnLeftLine = -2.2 * enemyRightButtomCornerX + planeY2 + 2.2 * planeX2; //根据斜率公式计算直线上对应的点
          var enemyLeftButtomCornerX = enemies[t].x;
          var enemyLeftButtomCornerY = enemies[t].y + enemyHeight;
          var enemyLeftButtomCorberYOnRightLine = 2.2 * enemyLeftButtomCornerX + planeY3 - 2.2 * planeX3;

            if ( planeY1 < enemies[t].y + enemyHeight &&
                  planeY2 > enemies[t].y &&
                  planeX2 < enemies[t].x + enemyWidth &&
                  planeX3 > enemies[t].x ) { //先假设飞机为一个正方体，发生碰撞
                    textSize(50);
                    text("碰撞将使飞机受损", 200, 300);

                    if (enemyRightButtomCornerY > enemyRightButtomCornerYOnLeftLine &&
                    enemyRightButtomCornerX < planeX3 &&
                    enemyLeftButtomCornerY > enemyLeftButtomCorberYOnRightLine &&
                    enemyLeftButtomCornerX > planeX2) { //左右都撞，变红
                      
                      fill(255, 0, 0);
                      text("受到严重撞击", 200, 400);
                      triangle(planeX1, planeY1,
                              planeX2, planeY2,
                              planeX3, planeY3);
                      rect(leftFireX, fireY, bulletSize, fireSize * 3);
                      rect(rightFireX, fireY, bulletSize, fireSize * 3);
                    } else if ((enemyRightButtomCornerY > enemyRightButtomCornerYOnLeftLine &&
                    enemyRightButtomCornerX < planeX3) ||
                    (enemyLeftButtomCornerY > enemyLeftButtomCorberYOnRightLine &&
                    enemyLeftButtomCornerX > planeX2)) { //撞一个，变蓝
                      
                      fill(0, 0, 255);
                      text("受到轻微撞击", 200, 500);
                      triangle(planeX1, planeY1,
                              planeX2, planeY2,
                              planeX3, planeY3);
                      rect(leftFireX, fireY, bulletSize, fireSize * 3);
                      rect(rightFireX, fireY, bulletSize, fireSize * 3);
                    }
                  }
          }
 

          // 消息动画
          for (var i = messages.length - 1; i >= 0; i--) {
            float ratio = messages[i].life / 90;
            fill(255, 255 * (1 - ratio), 0, 255 * ratio);
            text(messages[i].content, messages[i].x, messages[i].y);
            messages[i].y -= 0.5;
            messages[i].life--;
            if (messages[i].life <= 0) {
              messages.splice(i, 1);
            }
          }
        }
      }
    }
  </script>
</body>
</html>
