<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>雷霆战机</title>
<style>
body {
  margin: 0;
  overflow: hidden;
}
</style>
</head>
<body>
<canvas id="myCanvas"></canvas>
<script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"></script>

<script type="application/processing" data-processing-target="myCanvas">

var start = false;
var gameOver = false;

var bullets = [];
var enemies = [];
var messages = [];

var enemyWidth = innerWidth/20;
var enemyHeight = enemyWidth;
var planeSize = innerWidth/30;

int enemyEscapedCount = 0;
int enemyKilledCount = 0;
int bulletsFired = 0;
int bulletsAccessible = 200;

var waiting = 0;

/* ===== 手机控制变量 ===== */
var planeX = innerWidth/2;
var planeY = innerHeight*0.8;

var isTouching = false;
var touchStartTime = 0;
var longPress = false;

/* ===== 敌机生成 ===== */
void spawnEnemies(int num) {
  int amount = (num <= 0) ? int(random(5,15)) : num;
  for (int i = 0; i < amount; i++) {
    enemies.push({
      x: random(0, innerWidth - enemyWidth),
      y: 0,
      speed: random(1,4),
      damageHeight: 0
    });
  }
}

void setGame() {
  bullets = [];
  enemies = [];
  messages = [];
  waiting = 0;

  enemyEscapedCount = 0;
  enemyKilledCount = 0;
  bulletsFired = 0;
  bulletsAccessible = 200;

  spawnEnemies(0);
}

void setup() {
  size(innerWidth, innerHeight);
  frameRate(30);
}

/* ===== 点击开始（手机+电脑）===== */
void handlePress() {

  // 开始页面
  if (!start) {
    if (mouseX > innerWidth/4 && mouseX < innerWidth*3/4 &&
        mouseY > innerHeight/4 && mouseY < innerHeight*3/4) {
      start = true;
      gameOver = false;
      setGame();
    }
  }

  // 结算页面
  else if (gameOver && waiting >= 5) {
    if (mouseX > innerWidth/4 && mouseX < innerWidth*3/4 &&
        mouseY > innerHeight/4 && mouseY < innerHeight*3/4) {
      gameOver = false;
      setGame();
    }
  }
}

/* ===== 电脑点击 ===== */
void mousePressed() {
  handlePress();
}

/* ===== 手机触摸 ===== */
void touchStarted() {
  isTouching = true;
  touchStartTime = millis();
  handlePress();
}

void touchMoved() {
  planeX = mouseX;
  planeY = mouseY;
}

void touchEnded() {
  isTouching = false;
  longPress = false;
}

void draw() {

  background(100,100,155);

  /* ===== 开始页面 ===== */
  if (!start) {
    fill(0,255,0);
    rect(innerWidth/4, innerHeight/4, innerWidth/2, innerHeight/2);
    fill(255,0,0);
    textAlign(CENTER,CENTER);
    textSize(innerWidth/20);
    text("开始游戏", innerWidth/2, innerHeight/2);
    return;
  }

  /* ===== 游戏结束 ===== */
  if (gameOver) {
    waiting += 1.0/30;
    fill(255,0,0);
    textAlign(CENTER,CENTER);
    textSize(innerWidth/20);
    text("游戏结束\n5秒后可重新开始",
         innerWidth/2, innerHeight/2);
    return;
  }

  /* ===== 飞机坐标 ===== */
  if (!isTouching) {
    planeX = mouseX;
    planeY = mouseY;
  }

  /* ===== 长按检测（手机）===== */
  if (isTouching && millis() - touchStartTime > 200) {
    longPress = true;
  }

  /* ===== 发射子弹 ===== */
  if ((mousePressed || longPress) && bulletsAccessible > 0) {
    bullets.push({x: planeX - 10, y: planeY});
    bullets.push({x: planeX + 10, y: planeY});
    bulletsAccessible--;
    bulletsFired++;
  }

  /* ===== 绘制飞机 ===== */
  fill(0,255,0);
  triangle(planeX, planeY - planeSize,
           planeX - planeSize, planeY + planeSize,
           planeX + planeSize, planeY + planeSize);

  /* ===== 子弹 ===== */
  for (int i = bullets.length-1; i >= 0; i--) {
    bullets[i].y -= 15;
    rect(bullets[i].x, bullets[i].y, 5, 10);
    if (bullets[i].y < 0) bullets.remove(i);
  }

  /* ===== 敌人 ===== */
  for (int i = enemies.length-1; i >= 0; i--) {
    rect(enemies[i].x, enemies[i].y, enemyWidth, enemyHeight);
    enemies[i].y += enemies[i].speed;

    if (enemies[i].y > innerHeight) {
      enemies.remove(i);
      enemyEscapedCount++;
    }
  }

  if (enemies.length < 10) spawnEnemies(0);

  /* ===== HUD ===== */
  fill(0,255,255);
  textSize(20);
  text("子弹: "+bulletsAccessible,20,40);

  if (bulletsAccessible <= 0) {
    gameOver = true;
  }
}

</script>
</body>
</html>
