<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雷霆战机</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="myCanvas"></canvas>
  
  <script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"></script>
  <script type="application/processing" data-processing-target="myCanvas">
    var start = false;
    var gameOver = false;
    var bullets = [];
    var enemies = [];
    var planeSize = innerWidth/30;
    var enemyWidth = innerWidth/20;
    var enemyHeight = enemyWidth;
    int enemyEscapedCount = 0;
    int enemyKilledCount = 0;
    int bulletsFired = 0;
    int bulletsAccessible = 0;
    var messages = [];
    var waiting = 0;

    // --- 新增：专门针对手机端的坐标控制变量 ---
    float touchX = 0;
    float touchY = 0;
    boolean isTouching = false;

    void setup() {
      size(innerWidth, innerHeight);
      frameRate(30);
      // 初始化坐标到屏幕中心，防止飞机开局在左上角
      touchX = width/2;
      touchY = height/2;
    }

    // --- 核心修改：利用原生 Processing 事件同步触摸状态 ---
    void mousePressed() {
      isTouching = true;
      updateTouch();
      
      // 处理按钮点击逻辑
      if (!start) {
        if (mouseX > width/4 && mouseX < width*3/4 && mouseY > height/4 && mouseY < height*3/4) {
           start = true;
           gameOver = false;
           setGame();
        }
      } else if (gameOver && waiting >= 5) {
         if (mouseX > width/4 && mouseX < width*3/4 && mouseY > height/4 && mouseY < height*3/4) {
           gameOver = false;
           setGame();
         }
      }
    }

    void mouseReleased() {
      isTouching = false;
    }

    void mouseDragged() {
      updateTouch();
    }

    void updateTouch() {
      touchX = mouseX;
      touchY = mouseY;
    }

    void setGame() {
      bullets = [];
      enemies = [];
      messages = [];
      waiting = 0;
      enemyEscapedCount = 0;
      enemyKilledCount = 0;
      bulletsFired = 0;
      bulletsAccessible = 200;
      spawnEnemies();
    }

    void spawnEnemies() { spawnEnemies(null); }
    void spawnEnemies(num) {
      int addNum = (num == null) ? int(random(5, 15)) : int(num);
      for (int c = 0; c < addNum; c++) {
        enemies.push({
          x: random(0, width - enemyWidth),
          y: -random(0, height), // 随机错开高度，防止一排刷出来
          damageHeight: 0,
          speed: random(2, 6)
        });
      }
    }

    void draw() {
      background(100, 100, 155);

      if (!start) { // 菜单
        fill(255);
        if (mouseX > width/4 && mouseX < width*3/4 && mouseY > height/4 && mouseY < height*3/4) fill(0, 255, 0);
        rect(width/4, height/4, width/2, height/2);
        fill(255, 0, 0);
        textAlign(CENTER, CENTER);
        text("开始游戏", width/2, height/2);
      } else {
        if (gameOver) { // 结算界面
          fill(255);
          if (mouseX > width/4 && mouseX < width*3/4 && mouseY > height/4 && mouseY < height*3/4 && waiting >= 5) fill(0, 255, 0);
          rect(width/4, height/4, width/2, height/2);
          fill(255, 0, 0);
          waiting += 1.0/30.0;
          text("游戏结束\n" + max(0, ceil(5-waiting)) + "秒后重启", width/2, height/2);
        } else {
          // --- 游戏主逻辑：使用 touchX/touchY 代替 mouseX/mouseY ---
          var curX = (isTouching) ? mouseX : touchX;
          var curY = (isTouching) ? mouseY : touchY;

          // 画飞机
          fill(0, 255, 0);
          triangle(curX, curY - planeSize, curX - planeSize, curY + planeSize, curX + planeSize, curY + planeSize);
          
          // 发射子弹逻辑：只要 isTouching 是 true 且有子弹就发射
          if (isTouching && bulletsAccessible > 0) {
            bullets.push({ x: curX - 10, y: curY });
            bullets.push({ x: curX + 10, y: curY });
            bulletsFired++;
            bulletsAccessible--;
          }

          // 敌机更新
          for (var i = enemies.length - 1; i >= 0; i--) {
            var e = enemies[i];
            fill(255, 255, 0);
            rect(e.x, e.y, enemyWidth, enemyHeight);
            e.y += e.speed;
            if (e.y > height) {
              enemies.splice(i, 1);
              enemyEscapedCount++;
            }
          }

          // 子弹更新与碰撞
          for (var j = bullets.length - 1; j >= 0; j--) {
            var b = bullets[j];
            b.y -= 15;
            fill(255, 255, 0);
            rect(b.x, b.y, 4, 10);

            if (b.y < 0) {
              bullets.splice(j, 1);
              continue;
            }

            for (var k = enemies.length - 1; k >= 0; k--) {
              var e = enemies[k];
              if (b.x > e.x && b.x < e.x + enemyWidth && b.y > e.y && b.y < e.y + enemyHeight) {
                e.damageHeight -= 5;
                bullets.splice(j, 1);
                if (e.damageHeight < -enemyHeight) {
                  enemyKilledCount++;
                  bulletsAccessible += 5;
                  enemies.splice(k, 1);
                }
                break;
              }
            }
          }

          if (enemies.length < 5) spawnEnemies(3);
          if (bulletsAccessible <= 0 && bullets.length == 0) gameOver = true;

          // UI
          fill(0, 255, 255);
          textAlign(LEFT, TOP);
          text("击毁: " + enemyKilledCount + "\n子弹: " + bulletsAccessible, 20, 20);
        }
      }
    }
  </script>
</body>
</html>
